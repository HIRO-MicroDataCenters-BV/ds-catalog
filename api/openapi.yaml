openapi: 3.1.0
info:
  title: Data Space Catalog Service
  description: The service provides a REST API for managing and sharing catalog items.
  contact:
    name: HIRO-MicroDataCenters
    email: all-hiro@hiro-microdatacenters.nl
  license:
    name: MIT
    url: https://github.com/HIRO-MicroDataCenters-BV/ds-catalog/blob/main/LICENSE
  version: 0.1.1
paths:
  /metrics:
    get:
      summary: Metrics
      description: Endpoint that serves Prometheus metrics.
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health-check/:
    get:
      summary: Health check
      description: Returns a 200 status code if the service is up and running
      operationId: health_check
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
  /catalog/:
    post:
      tags:
      - Catalog
      summary: Get Local Catalog
      description: "Get the local catalog with dataset list.\n\nThe request accepts\
        \ filters as a JSON object in the body.\n\n### Format:\nFilters are structured\
        \ as nested JSON objects. Each filter defines the path\nto the field with\
        \ optional operators or language annotations.\n\n```json\n{\n  \"context\"\
        : {\n    \"<namespace>\": \"<namespaceURL>\",\n    ...\n  }\n  \"filters\"\
        : [\n    {\n      [\"type\": \"<namespace:Class>\",]\n      \"<namespace:attribute>[@<lang>][__operator]\"\
        : <value> | <nestedObject>\n    },\n    ...\n  ]\n}\n```\n\n### Supported\
        \ operators:\n- `__gte`, `__lte` \u2014 range filtering\n- `__in` \u2014 list\
        \ filtering\n- `__contains` \u2014 substring search\n\n### Example:\n```json\n\
        {\n  \"context\": {\n    \"dcat\": \"http://www.w3.org/ns/dcat#\",\n    \"\
        dspace\": \"http://data-space.org/\",\n    \"med\": \"http://med.example.org/\"\
        \n  },\n  \"filters\": [\n    {\n      \"dcat:dataset\": {\n        \"dspace:extraMetadata\"\
        : {\n          \"type\": \"med:Diagnoses\",\n          \"med:hasDiagnosis\"\
        : {\n            \"med:code__contains\": \"I10\"\n          }\n        }\n\
        \      }\n    }\n  ]\n}\n```\n\n### More filter examples:\n- ```json\n  {\
        \ \"dcat:dataset\": { \"dcterms:title\": \"example\" } }\n  ```\n- ```json\n\
        \  { \"dcat:dataset\": { \"dcterms:title@en\": \"example\" } }\n  ```\n- ```json\n\
        \  { \"dcat:dataset\": { \"dcterms:title\": { \"@language\": \"en\" } } }\n\
        \  ```\n- ```json\n  { \"dcat:dataset\": { \"dcterms:title\": { \"@value\"\
        : \"example\" } } }\n  ```\n- ```json\n  { \"dcat:dataset\": { \"dcat:distribution\"\
        : { \"dcat:format\": \"PDF\" } } }\n  ```\n- ```json\n  { \"dcat:dataset\"\
        : { \"dspace:extraMetadata\": { \"med:sex\": \"M\" } } }\n  ```\n- ```json\n\
        \  { \"dcat:dataset\": { \"dspace:extraMetadata\": { \"type\": \"med:Patient\"\
        ,\n  \"med:sex\": \"M\" } } }\n  ```\n- ```json\n  { \"dcat:dataset\": { \"\
        dspace:extraMetadata\": { \"med:weight\": 75 } } }\n  ```\n- ```json\n  {\
        \ \"dcat:dataset\": { \"dspace:extraMetadata\": { \"med:weight\": {\n  \"\
        @value\": 75 } } } }\n  ```\n- ```json\n  { \"dcat:dataset\": { \"dspace:extraMetadata\"\
        : { \"med:weight\": {\n  \"@type\": \"xsd:integer\" } } } }\n  ```\n- ```json\n\
        \  { \"dcat:dataset\": { \"dcterms:datePublished__gte\": \"2021-01-01\" }\
        \ }\n  ```\n- ```json\n  { \"dcat:dataset\": { \"dcterms:datePublished__lte\"\
        : \"2021-12-31\" } }\n  ```\n- ```json\n  { \"dcat:dataset\": { \"dspace:extraMetadata\"\
        : { \"med:weight__gte\": 70 } } }\n  ```\n- ```json\n  { \"dcat:dataset\"\
        : { \"dspace:extraMetadata\": { \"med:weight__lte\": 70 } } }\n  ```\n- ```json\n\
        \  { \"dcat:dataset\": { \"dcat:keyword__in\": [\"science\", \"health\"] }\
        \ }\n  ```\n- ```json\n  { \"dcat:dataset\": { \"dcterms:title@en__contains\"\
        : \"example\" } }\n  ```"
      operationId: get_catalog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogFilters'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/ld+json:
              schema:
                type: string
              example:
                '@context':
                  xsd: http://www.w3.org/2001/XMLSchema#
                  dcat: http://www.w3.org/ns/dcat#
                  dcatap: http://data.europa.eu/r5r/
                  dcterms: http://purl.org/dc/terms/
                  spdx: http://spdx.org/rdf/terms#
                  foaf: http://xmlns.com/foaf/0.1/
                  skos: http://www.w3.org/2004/02/skos/core#
                  dspace: http://data-space.org/
                '@graph':
                  '@id': https://example.com/catalog/123
                  '@type': dcat:Catalog
                  dcterms:title:
                  - '@language': en
                    '@value': Sample Catalog
                  dcterms:description:
                  - '@language': en
                    '@value': This is a sample catalog containing various datasets
                      and services.
                  dcterms:publisher:
                    '@id': https://example.com/person/123
                    '@type': foaf:Agent
                    foaf:name: John Doe
                  dcat:dataset:
                  - '@id': https://example.com/dataset/789
                    '@type': dcat:Dataset
                    dcterms:identifier: abc-123-xyz
                    dcterms:title:
                    - '@language': en
                      '@value': Sample Dataset Title
                    - '@language': es
                      '@value': "T\xEDtulo del conjunto de datos de ejemplo"
                    dcterms:description:
                    - '@language': en
                      '@value': This dataset contains sample data for testing purposes.
                    - '@language': es
                      '@value': Este conjunto de datos contiene datos de ejemplo para
                        fines de prueba.
                    dcat:keyword:
                    - sample
                    - data
                    dcterms:license: https://example.com/license/xyz
                    dcat:theme:
                    - '@id': http://eurovoc.europa.eu/100142
                      '@type': skos:Concept
                      skos:prefLabel:
                      - '@value': Agriculture
                        '@language': en
                    - '@id': http://eurovoc.europa.eu/100141
                      '@type': skos:Concept
                      skos:prefLabel:
                      - '@value': Health
                        '@language': en
                    dcat:distribution:
                    - '@id': https://example.com/distribution/489
                      '@type': dcat:Distribution
                      dcterms:description:
                      - '@language': en
                        '@value': This is a sample distribution.
                      dcat:byteSize:
                        '@value': 1024
                        '@type': xsd:decimal
                      dcat:mediaType:
                        '@id': https://www.iana.org/assignments/media-types/application/json
                      dcat:format: JSON
                      dcatap:availability:
                      - '@id': http://data.europa.eu/r5r/AVAILABLE
                      spdx:checksum:
                        spdx:algorithm: SHA-256
                        spdx:checksumValue: 3a7bd3e2360a3b5c1b2ef3b1a4e8f7a6
                      dcat:accessURL:
                        '@id': https://example.com/distribution/489/information
                      dcat:accessService:
                      - '@id': https://example.com/dataservice/456
                        '@type': dcat:DataService
                        dcterms:title:
                        - '@language': en
                          '@value': Sample Data Service
                        dcat:endpointURL:
                          '@id': https://example.com/dataservice/456/download
                    dcat:inSeries:
                      '@id': string
                    dspace:extraMetadata:
                    - '@id': https://example.com/metadata/1
                      '@type': med:Patient
                      med:height:
                        '@value': '180'
                        '@type': xsd:integer
                      med:weight:
                        '@value': '75'
                        '@type': xsd:integer
                      med:sex: M
                      med:birthDate: '1990-05-20'
                    - '@id': https://example.com/metadata/2
                      '@type': med:Diagnoses
                      med:hasDiagnosis:
                      - '@id': https://example.com/diagnosis/1
                        '@type': med:Diagnosis
                        med:code: I10
                        med:description: Essential (primary) hypertension
                      - '@id': https://example.com/diagnosis/2
                        '@type': med:Diagnosis
                        med:code: E11
                        med:description: Type 2 diabetes mellitus
                    dcterms:issued: '2025-03-13'
                    dcterms:publisher:
                      '@id': https://example.com/person/123
                      '@type': foaf:Agent
                      foaf:name: John Doe
                    dspace:isShared: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
