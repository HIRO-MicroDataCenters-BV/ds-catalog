version: "3.8"
services:
  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j}
      - NEO4JLABS_PLUGINS=["n10s"]
      - NEO4J_dbms_security_procedures_unrestricted=n10s.*
      - NEO4J_dbms_security_procedures_allowlist=n10s.*
    ports:
      - "7474:7474"
      - "7473:7473"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  neo4j-init:
    image: neo4j:5.18.0
    container_name: neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j-init.sh:/neo4j-init.sh
    entrypoint: ["bash", "/neo4j-init.sh"]
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j}
    restart: "no"

  ds-catalog:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ds-catalog
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DS__DATABASE__PROTOCOL=bolt
      - DS__DATABASE__HOST=neo4j
      - DS__DATABASE__PORT=7687
      - DS__DATABASE__NAME=neo4j
      - DS__DATABASE__USERNAME=${NEO4J_USER:-neo4j}
      - DS__DATABASE__PASSWORD=${NEO4J_PASSWORD:-neo4j}
      - DS__ALLOWED_VALUES_CONFIG_PATH=/code/app/core/allowed_values.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/code/app
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
