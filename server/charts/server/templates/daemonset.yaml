{{- if eq .Values.deploymentMode "daemonset" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "app.name" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "app.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "app.name" . }}
        {{- include "app.labels" . | nindent 8 }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      serviceAccountName: {{ include "app.serviceAccountName" . }}

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: {{ include "app.name" . | lower }}
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: {{ include "app.name" . }}-labeler
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              NODE_NAME=$(echo $NODE_NAME)
              POD_NAME=$(echo $POD_NAME)
              POD_NAMESPACE=$(echo $POD_NAMESPACE)
              NODE_LABEL=$(kubectl get node "$NODE_NAME" -o jsonpath='{.metadata.labels.node-id}')
              kubectl label pod "$POD_NAME" node-id="$NODE_LABEL" -n "$POD_NAMESPACE" --overwrite
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

        {{- if .Values.migrate.enabled }}
        - name: migrate-db
          image: "{{ include "app.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "poetry run python -m app.migrate_db"]
          env:
            {{- include "app.commonEnv" . | nindent 12 }}
        {{- end }}

      containers:
        - name: catalog
          image: "{{ include "app.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toYaml .Values.container.command | nindent 12 }}
          args: {{ toYaml .Values.container.args | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              hostPort: {{ .Values.service.port }}
          env:
            {{- include "app.commonEnv" . | nindent 12 }}
          resources:

            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
