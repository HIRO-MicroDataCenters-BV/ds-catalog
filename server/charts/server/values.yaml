replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

resources: {}

livenessProbe:
  httpGet:
    path: /health-check/
    port: http
readinessProbe:
  httpGet:
    path: /health-check/
    port: http

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  mountPath: /code/uploads

catalog:
  title: Catalog
  description: My Local Catalog

database:
  protocol: neo4j
  host: localhost
  port: 7687
  name: neo4j
  username: neo4j
  password: your_password

migrate:
  enabled: false
