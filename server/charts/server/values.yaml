replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "ds-catalog"


serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

container:
  command: ["uvicorn"]
  args: ["app.main:app", "--host", "0.0.0.0", "--port", "8081"]

service:
  type: ClusterIP
  port: 8081

resources: {}

livenessProbe:
  httpGet:
    path: /health-check/
    port: 8081

readinessProbe:
  httpGet:
    path: /health-check/
    port: 8081

catalog:
  title: Catalog
  description: My Local Catalog

database:
  protocol: bolt
  host: "my-neo4j-semantics.nextgen.svc.cluster.local"  # Full DNS
  port: 7687
  name: neo4j
  username: neo4j
  password: "123456789"  # Must match Neo4j's password

migrate:
  enabled: true
