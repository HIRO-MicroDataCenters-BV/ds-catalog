replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: ""
nameOverride: ""
fullnameOverride: "ds-catalog"


serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

container:
  command: ["uvicorn"]
  args: ["app.main:app", "--host", "0.0.0.0", "--port", "8081"]

service:
  type: ClusterIP
  port: 8081

livenessProbe:
  httpGet:
    path: /health-check/
    port: 8081

readinessProbe:
  httpGet:
    path: /health-check/
    port: 8081

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  mountPath: /code/uploads

catalog:
  title: Catalog
  description: My Local Catalog

database:
  protocol: bolt
  host: "ds-neo4j"
  port: 7687
  name: neo4j
  username: neo4j
  password: "123456789"  # Must match Neo4j's password

migrate:
  enabled: false  # Set to true to enable database migration

resources:
  requests:
    memory: "64Mi"
    cpu: "250m"
  limits:
    memory: "128Mi"
    cpu: "500m"

namespace: nextgen

deploymentMode: deployment  # or "daemonset"

ingress:
  enabled: true
  host: nextgen.hiro-develop.nl

## Update this according to the desired node
nodeSelector:
  role: node-label

## To control the metics on development
metrics:
  enabled: true

## To control the grafana on development
grafana:
  enabled: true

baseUrls:
  connectorBaseUrl: "https://ds-connector.{region}.nextgen.hiro-develop.nl"
  ocaRepositoryBundlesUrl: "https://oca-repository.marketplace.nextgen.hiro-develop.nl/oca-bundles"

# Path to the YAML file defining allowed predicate values for RDF validation.
# Defaults to the file bundled in the image. Change this only if you provide
# the file yourself (e.g. via a custom image or an externally managed volume
# mount). Note: this chart does not configure such a mount by default, and
# updates to the file take effect only after a pod restart.
allowedValuesConfigPath: "/code/app/core/allowed_values.yaml"
