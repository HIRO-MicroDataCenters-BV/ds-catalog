[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ds-catalog"
version = "0.0.0"
description = "Data Space Catalog Service"
readme = "README.md"
authors = ["HIRO-MicroDataCenters <all-hiro@hiro-microdatacenters.nl>"]
license = "MIT"
repository = "https://github.com/HIRO-MicroDataCenters-BV/ds-catalog"
homepage = "https://github.com/HIRO-MicroDataCenters-BV/ds-catalog"
packages = [{include = "*", from="app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109"
uvicorn = "^0.26"
classy-fastapi = "^0.6.1"
prometheus-fastapi-instrumentator = "^6.1.0"
pydantic-settings = "^2.5.2"
pytz = "^2024.2"
types-pytz = "^2024.2.0.20240913"
aiohttp = "^3.10.5"
neo4j = "^5.28.1"
rdflib = "^7.1.3"
requests = "^2.32.3"
pyld = "^2.0.4"
polyfactory = "^2.20.0"
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
black = "^23.12"
flake8 = "^7.0"
isort = {extras = ["colors"], version = "^5.13"}
mypy = "^1.8"
mypy-extensions = "^1.0"
pyyaml = "^6.0.1"
types-pyyaml = "^6.0.12.12"

[tool.poetry.group.test.dependencies]
pytest-asyncio = "^0.24.0"
pytest = "^8.2"
pytest-mock = "^3.12.0"
pytest-snapshot = "^0.9.0"
freezegun = "^1.5.1"
httpx = "^0.26"

[tool.isort]
# https://github.com/timothycrosley/isort/
line_length = 88

known_typing = ["typing", "types", "typing_extensions", "mypy", "mypy_extensions"]
sections = ["FUTURE", "TYPING", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
include_trailing_comma = true
profile = "black"
multi_line_output = 3
indent = 4
color_output = true

[tool.black]
# https://github.com/psf/black
line-length = 88
color = true

[tool.pytest.ini_options]
# https://docs.pytest.org/en/6.2.x/customize.html#pyproject-toml
# Directories that are not visited by pytest collector:
norecursedirs =["hooks", "*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]
doctest_optionflags = ["NUMBER", "NORMALIZE_WHITESPACE", "IGNORE_EXCEPTION_DETAIL"]
asyncio_default_fixture_loop_scope = "function"

# Extra options:
addopts = [
  "--strict-markers",
  "--tb=short",
  "--doctest-modules",
  "--doctest-continue-on-failure",
]
